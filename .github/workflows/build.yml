name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Run Android Build
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Looking for build files..."
          find . -name "gradlew"
          # Try to find and use gradle wrapper if located in subfolder
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ ! -z "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            "$GRADLEW_PATH" assembleDebug
          else
            echo "Gradle wrapper not found, building with default gradle if available"
            gradle assembleDebug
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
